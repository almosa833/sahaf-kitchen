<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطبخ الصحاف للمناسبات</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Tajawal -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Tajawal', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fdf8f6',
                            100: '#f2e8e5',
                            500: '#d97757', // Warm food-like color
                            600: '#c26243',
                            900: '#4a261a',
                        },
                        accent: {
                            500: '#10b981', // Emerald green for success/accents
                            600: '#059669',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d97757' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        /* Custom scrollbar for table */
        .table-container::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .table-container::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-md border-b-4 border-brand-500 sticky top-0 z-40">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-brand-100 text-brand-600 p-3 rounded-full">
                    <i class="fa-solid fa-utensils text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">مطبخ الصحاف للمناسبات</h1>
                    <p class="text-sm text-gray-500">نظام إدارة الحجوزات والطلبات</p>
                </div>
            </div>
            <div>
                <button onclick="exportToCSV()" class="hidden md:flex bg-accent-500 hover:bg-accent-600 text-white px-5 py-2.5 rounded-lg shadow-sm transition duration-200 items-center gap-2 font-medium">
                    <i class="fa-solid fa-file-excel"></i>
                    تصدير إلى Excel
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 flex-grow flex flex-col lg:flex-row gap-6">
        
        <!-- Right Column: Booking Form -->
        <div class="lg:w-1/3 w-full">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden sticky top-28">
                <div class="bg-brand-50 border-b border-brand-100 px-6 py-4">
                    <h2 class="text-lg font-bold text-brand-900 flex items-center gap-2">
                        <i class="fa-solid fa-calendar-plus text-brand-500"></i>
                        إضافة حجز جديد
                    </h2>
                </div>
                <div class="p-6">
                    <form id="bookingForm" class="space-y-4">
                        <!-- Customer Name -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1" for="customerName">اسم العميل <span class="text-red-500">*</span></label>
                            <input type="text" id="customerName" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition" placeholder="مثال: أحمد عبدالله">
                        </div>
                        
                        <!-- Mobile Number -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1" for="mobileNumber">رقم الجوال <span class="text-red-500">*</span></label>
                            <input type="tel" id="mobileNumber" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition text-right" placeholder="05XXXXXXXX">
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <!-- Event Date -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1" for="eventDate">تاريخ المناسبة <span class="text-red-500">*</span></label>
                                <input type="date" id="eventDate" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition">
                            </div>
                            
                            <!-- Delivery Time -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1" for="deliveryTime">وقت التوصيل <span class="text-red-500">*</span></label>
                                <input type="time" id="deliveryTime" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition bg-white">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <!-- Dish Type -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1" for="dishType">الصنف <span class="text-red-500">*</span></label>
                                <select id="dishType" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition bg-white">
                                    <option value="" disabled selected>اختر الصنف</option>
                                    <option value="برياني">برياني</option>
                                    <option value="مندي">مندي</option>
                                    <option value="كبسة">كبسة</option>
                                </select>
                            </div>
                            
                            <!-- Trays Count -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1" for="traysCount">عدد الصواني <span class="text-red-500">*</span></label>
                                <input type="number" id="traysCount" min="0" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition" placeholder="مثال: 5">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <!-- Tray Size -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1" for="traySize">حجم الصواني <span class="text-red-500">*</span></label>
                                <select id="traySize" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition bg-white">
                                    <option value="" disabled selected>اختر الحجم</option>
                                    <option value="45">45</option>
                                    <option value="50">50</option>
                                    <option value="55">55</option>
                                    <option value="60">60</option>
                                    <option value="سفري">سفري</option>
                                    <option value="مفطح">مفطح</option>
                                </select>
                            </div>
                            
                            <!-- Sheep Count -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1" for="sheepCount">عدد الذبائح <span class="text-red-500">*</span></label>
                                <input type="number" id="sheepCount" min="0" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition" placeholder="مثال: 2">
                            </div>

                            <!-- Sheep Pieces -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1" for="sheepPieces">قطع الذبيحة <span class="text-red-500">*</span></label>
                                <input type="number" id="sheepPieces" min="0" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition" placeholder="مثال: 4">
                            </div>
                        </div>

                        <!-- Notes -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1" for="bookingNotes">ملاحظات إضافية (اختياري)</label>
                            <textarea id="bookingNotes" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition resize-none" placeholder="تفضيلات الطعام، وقت التوصيل..."></textarea>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" id="submitBtn" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-bold py-3 px-4 rounded-lg shadow transition duration-200 flex justify-center items-center gap-2 mt-4 disabled:opacity-70 disabled:cursor-not-allowed">
                            <i id="submitIcon" class="fa-solid fa-check-circle"></i>
                            <span id="submitText">تأكيد وحفظ الحجز</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Left Column: Bookings Table -->
        <div class="lg:w-2/3 w-full flex flex-col gap-4">
            
            <!-- Mobile Export Button -->
            <button onclick="exportToCSV()" class="md:hidden w-full bg-accent-500 hover:bg-accent-600 text-white px-5 py-3 rounded-lg shadow transition duration-200 flex justify-center items-center gap-2 font-medium">
                <i class="fa-solid fa-file-excel"></i>
                تصدير الحجوزات إلى Excel
            </button>

            <div class="bg-white rounded-xl shadow-sm border border-gray-100 flex-grow flex flex-col overflow-hidden">
                <div class="px-6 py-5 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                    <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-gray-500"></i>
                        سجل الحجوزات
                    </h2>
                    <span id="bookingCountBadge" class="bg-brand-100 text-brand-600 text-xs font-bold px-3 py-1 rounded-full">0 حجز</span>
                </div>
                
                <div class="p-0 flex-grow relative">
                    <div class="table-container overflow-x-auto h-full max-h-[600px]">
                        <table class="w-full text-right border-collapse">
                            <thead class="bg-gray-50 sticky top-0 z-10 shadow-sm">
                                <tr>
                                    <th class="px-4 py-3 text-sm font-bold text-gray-600 border-b">العميل</th>
                                    <th class="px-4 py-3 text-sm font-bold text-gray-600 border-b">الموعد</th>
                                    <th class="px-4 py-3 text-sm font-bold text-gray-600 border-b">الصنف</th>
                                    <th class="px-4 py-3 text-sm font-bold text-gray-600 border-b">تفاصيل الكمية</th>
                                    <th class="px-4 py-3 text-sm font-bold text-gray-600 border-b">ملاحظات</th>
                                    <th class="px-4 py-3 text-sm font-bold text-gray-600 border-b text-center">إجراء</th>
                                </tr>
                            </thead>
                            <tbody id="bookingsTableBody" class="divide-y divide-gray-100">
                                <!-- Loading State -->
                                <tr id="loadingStateRow">
                                    <td colspan="6" class="px-6 py-12 text-center text-gray-500">
                                        <div class="flex flex-col items-center justify-center">
                                            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-brand-500 mb-3"></i>
                                            <p class="text-lg font-medium">جاري تحميل الحجوزات من السحابة...</p>
                                        </div>
                                    </td>
                                </tr>
                                <!-- Empty State -->
                                <tr id="emptyStateRow" style="display: none;">
                                    <td colspan="6" class="px-6 py-12 text-center text-gray-500">
                                        <div class="flex flex-col items-center justify-center">
                                            <i class="fa-solid fa-clipboard-list text-4xl text-gray-300 mb-3"></i>
                                            <p class="text-lg font-medium">لا توجد حجوزات حالياً</p>
                                            <p class="text-sm">قم بإضافة حجز جديد من النموذج الجانبي</p>
                                        </div>
                                    </td>
                                </tr>
                                <!-- Dynamic rows will be inserted here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Custom Modal for Alerts (Instead of window.alert) -->
    <div id="customModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-xl shadow-xl max-w-sm w-full mx-4 transform scale-95 transition-transform duration-300 overflow-hidden">
            <div id="modalHeader" class="px-6 py-4 flex items-center gap-3">
                <i id="modalIcon" class="fa-solid fa-circle-info text-2xl"></i>
                <h3 id="modalTitle" class="text-lg font-bold">رسالة</h3>
            </div>
            <div class="px-6 py-4 text-gray-600 border-t border-gray-100">
                <p id="modalMessage"></p>
            </div>
            <div class="px-6 py-4 bg-gray-50 text-left">
                <button onclick="closeModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium py-2 px-6 rounded-lg transition duration-150">
                    حسناً
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // ==========================================
        // ضع الرابط الخاص بـ Google Apps Script هنا
        // ==========================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxxS6KGkgPxvwlpWPRnduA9yoN7ow8b1wAa5FPpa-EFwlb8Kj-IuIGtLpMg_j2Xc8sjDA/exec'; 

        // Data State
        let bookings = [];

        // DOM Elements
        const form = document.getElementById('bookingForm');
        const submitBtn = document.getElementById('submitBtn');
        const submitIcon = document.getElementById('submitIcon');
        const submitText = document.getElementById('submitText');
        const tableBody = document.getElementById('bookingsTableBody');
        const emptyStateRow = document.getElementById('emptyStateRow');
        const loadingStateRow = document.getElementById('loadingStateRow');
        const bookingCountBadge = document.getElementById('bookingCountBadge');
        
        // Modal Elements
        const modal = document.getElementById('customModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalHeader = document.getElementById('modalHeader');
        const modalIcon = document.getElementById('modalIcon');

        // Fetch bookings on page load
        window.addEventListener('DOMContentLoaded', fetchBookings);

        async function fetchBookings() {
            if (SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
                showModal('تنبيه هام', 'يجب إعداد رابط Google Apps Script في الكود لكي تعمل المزامنة وتظهر البيانات.', 'warning');
                loadingStateRow.style.display = 'none';
                emptyStateRow.style.display = 'table-row';
                return;
            }

            loadingStateRow.style.display = 'table-row';
            emptyStateRow.style.display = 'none';
            tableBody.querySelectorAll('.booking-row').forEach(row => row.remove());

            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                if (data.status === 'success') {
                    bookings = data.data || [];
                    updateTable();
                } else {
                    throw new Error('فشل في جلب البيانات');
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                showModal('خطأ بالاتصال', 'حدث خطأ أثناء جلب الحجوزات. تحقق من اتصالك بالإنترنت.', 'error');
                loadingStateRow.style.display = 'none';
                emptyStateRow.style.display = 'table-row';
            }
        }

        // Handle Form Submission
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            if (SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
                showModal('تنبيه', 'لا يمكن الحفظ، يرجى إعداد رابط Google Apps Script أولاً.', 'warning');
                return;
            }

            // Set Loading State for Button
            submitBtn.disabled = true;
            submitIcon.className = 'fa-solid fa-circle-notch fa-spin';
            submitText.textContent = 'جاري الحفظ في السحابة...';

            // Create FormData object
            const formData = new FormData();
            formData.append('customerName', document.getElementById('customerName').value.trim());
            formData.append('mobileNumber', document.getElementById('mobileNumber').value.trim());
            formData.append('eventDate', document.getElementById('eventDate').value);
            formData.append('deliveryTime', document.getElementById('deliveryTime').value);
            formData.append('dishType', document.getElementById('dishType').value);
            formData.append('traysCount', document.getElementById('traysCount').value);
            formData.append('traySize', document.getElementById('traySize').value);
            formData.append('sheepCount', document.getElementById('sheepCount').value);
            formData.append('sheepPieces', document.getElementById('sheepPieces').value);
            formData.append('bookingNotes', document.getElementById('bookingNotes').value.trim() || 'لا يوجد');

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();

                if (result.status === 'success') {
                    form.reset();
                    showModal('نجاح', 'تم إضافة الحجز وحفظه في السحابة بنجاح!', 'success');
                    await fetchBookings(); // Refresh table
                } else {
                    throw new Error('Server returned error');
                }
            } catch (error) {
                console.error('Error saving data:', error);
                showModal('خطأ', 'حدث خطأ أثناء حفظ الحجز. الرجاء المحاولة مرة أخرى.', 'error');
            } finally {
                // Reset Button State
                submitBtn.disabled = false;
                submitIcon.className = 'fa-solid fa-check-circle';
                submitText.textContent = 'تأكيد وحفظ الحجز';
            }
        });

        // Function to delete booking (Local UI only, requires App Script update for actual deletion)
        function deleteBooking(index) {
            showModal('تنبيه', 'للحذف النهائي، يرجى فتح ملف Google Sheets المربوط وحذف الصف الخاص بالحجز مباشرة.', 'info');
        }

        // Format Date to Display Arabic Style if needed
        function formatDate(dateStr) {
            if(!dateStr) return '';
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            // If date is fully numeric or ISO string, format it
            if (dateStr.includes('-') || dateStr.includes('/')) {
                try {
                     return new Date(dateStr).toLocaleDateString('ar-SA', options);
                } catch(e) {}
            }
            return dateStr;
        }

        // Format Time to 12-hour AM/PM
        function formatTime(timeStr) {
            if(!timeStr) return '';
            // Handle if time already has AM/PM (from Google Sheets format)
            if(timeStr.includes('م') || timeStr.includes('ص') || timeStr.includes('AM') || timeStr.includes('PM') || timeStr.includes('Z')) {
                try {
                    const dt = new Date(timeStr);
                    if(!isNaN(dt.getTime())) {
                       return dt.toLocaleTimeString('ar-SA', {hour: '2-digit', minute:'2-digit'});
                    }
                } catch(e) {}
                return timeStr; // Return as is if format is unknown
            }
            
            const [hour, minute] = timeStr.split(':');
            if (!hour || !minute) return timeStr;
            
            let h = parseInt(hour, 10);
            const ampm = h >= 12 ? 'م' : 'ص';
            h = h % 12;
            h = h ? h : 12; // the hour '0' should be '12'
            return `${h}:${minute} ${ampm}`;
        }

        // Update Table UI
        function updateTable() {
            loadingStateRow.style.display = 'none';
            // Update count
            bookingCountBadge.textContent = `${bookings.length} حجز`;

            // Clear current rows except empty and loading states
            tableBody.querySelectorAll('.booking-row').forEach(row => row.remove());

            if (bookings.length === 0) {
                emptyStateRow.style.display = 'table-row';
                return;
            }

            emptyStateRow.style.display = 'none';

            // Add rows (Assuming oldest first, so we reverse to show newest first)
            bookings.slice().reverse().forEach((booking, index) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 transition duration-150 booking-row';
                
                tr.innerHTML = `
                    <td class="px-4 py-3">
                        <div class="font-bold text-gray-800">${booking.customerName || ''}</div>
                        <div class="text-sm text-gray-500 dir-ltr text-right">${booking.mobileNumber || ''}</div>
                    </td>
                    <td class="px-4 py-3">
                        <div class="text-gray-800 whitespace-nowrap">${formatDate(booking.eventDate)}</div>
                        <div class="text-sm text-brand-600 mt-1"><i class="fa-regular fa-clock"></i> ${formatTime(booking.deliveryTime)}</div>
                    </td>
                    <td class="px-4 py-3">
                        <div class="text-gray-800 font-medium">${booking.dishType || ''}</div>
                        <div class="text-sm text-gray-500 mt-1">حجم الصواني: ${booking.traySize || ''}</div>
                    </td>
                    <td class="px-4 py-3 text-gray-700">
                        <div class="bg-gray-100 text-gray-800 px-2 py-1 rounded font-bold text-xs mb-1 inline-block whitespace-nowrap">${booking.traysCount || 0} صواني</div>
                        <div class="bg-brand-50 text-brand-700 px-2 py-1 rounded font-bold text-xs inline-block whitespace-nowrap">${booking.sheepCount || 0} ذبيحة (${booking.sheepPieces || 0} قطع)</div>
                    </td>
                    <td class="px-4 py-3 text-sm text-gray-600 max-w-[150px] truncate" title="${booking.bookingNotes || ''}">
                        ${booking.bookingNotes || 'لا يوجد'}
                    </td>
                    <td class="px-4 py-3 text-center">
                        <button onclick="deleteBooking(${index})" class="text-red-500 hover:text-red-700 hover:bg-red-50 p-2 rounded-full transition" title="حذف الحجز">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // Export to CSV Function
        function exportToCSV() {
            if (bookings.length === 0) {
                showModal('تنبيه', 'لا توجد حجوزات لتصديرها.', 'warning');
                return;
            }

            // Headers mapped to Arabic
            const headers = ['اسم العميل', 'رقم الجوال', 'تاريخ المناسبة', 'وقت التوصيل', 'الصنف', 'عدد الصواني', 'حجم الصواني', 'عدد الذبائح', 'قطع الذبيحة', 'ملاحظات'];
            
            // UTF-8 Byte Order Mark (BOM) is CRITICAL for Excel to read Arabic correctly
            let csvContent = '\uFEFF' + headers.join(',') + '\n';

            bookings.forEach(b => {
                // Escape quotes and wrap fields in quotes to handle commas in text
                const row = [
                    b.name,
                    b.phone,
                    b.date,
                    b.time,
                    b.dishType,
                    b.traysCount,
                    b.traySize,
                    b.sheepCount,
                    b.sheepPieces,
                    b.notes.replace(/"/g, '""') // Escape double quotes
                ].map(field => `"${field}"`).join(',');
                
                csvContent += row + '\n';
            });

            // Create Blob and trigger download
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            
            // Generate filename with current date
            const dateStr = new Date().toISOString().split('T')[0];
            const fileName = `حجوزات_المطبخ_${dateStr}.csv`;

            if (navigator.msSaveBlob) { // IE 10+
                navigator.msSaveBlob(blob, fileName);
            } else {
                const url = URL.createObjectURL(blob);
                link.setAttribute('href', url);
                link.setAttribute('download', fileName);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        // Custom Modal Logic
        function showModal(title, message, type = 'info') {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            
            // Reset styles
            modalHeader.className = 'px-6 py-4 flex items-center gap-3 text-white';
            
            if (type === 'success') {
                modalHeader.classList.add('bg-accent-500');
                modalIcon.className = 'fa-solid fa-circle-check text-2xl';
            } else if (type === 'warning') {
                modalHeader.classList.add('bg-amber-500');
                modalIcon.className = 'fa-solid fa-triangle-exclamation text-2xl';
            } else {
                modalHeader.classList.add('bg-blue-500');
                modalIcon.className = 'fa-solid fa-circle-info text-2xl';
            }

            modal.classList.remove('hidden');
            // Small delay to allow display:block to apply before changing opacity for transition
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.children[0].classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            modal.classList.add('opacity-0');
            modal.children[0].classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300); // match transition duration
        }
    </script>
</body>
</html>
