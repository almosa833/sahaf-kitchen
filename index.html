<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطبخ الصحاف للمناسبات - إدارة الحجوزات والطلبات</title>
    <!-- Bootstrap RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { 
            background-color: #fcfbfa; 
            background-image: radial-gradient(#e5ddd5 0.75px, transparent 0.75px);
            background-size: 16px 16px;
            font-family: system-ui, -apple-system, sans-serif; 
            text-align: right;
        }
        .navbar-custom { background-color: #ffffff; border-bottom: 3px solid #d97743; }
        .card { border: none; box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.04); border-radius: 12px; background-color: #ffffff; }
        .btn-primary-custom { background-color: #d97743; border-color: #d97743; color: #ffffff; }
        .btn-primary-custom:hover { background-color: #c06333; border-color: #c06333; color: #ffffff; }
        .table-hover tbody tr:hover { background-color: rgba(217, 119, 67, 0.05); }
        .form-control, .form-select { border-radius: 8px; padding: 10px 15px; border: 1px solid #dee2e6; text-align: right; }
        .form-control:focus, .form-select:focus { border-color: #d97743; box-shadow: 0 0 0 0.25rem rgba(217, 119, 67, 0.25); }
    </style>
</head>
<body>

    <!-- النافبار العلوي -->
    <nav class="navbar navbar-custom shadow-sm mb-4 py-3">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
            <div class="text-start">
                <button class="btn btn-success btn-sm px-3 py-2 fw-bold shadow-sm" onclick="exportToExcel()">
                    <i class="fa-solid fa-file-excel ms-1"></i> تصدير إلى Excel
                </button>
            </div>
            <div class="text-end">
                <span class="h4 fw-bold text-dark mb-0">مطبخ الصحاف للمناسبات <i class="fa-solid fa-utensils text-danger ms-1"></i></span>
                <p class="text-muted small mb-0">نظام إدارة الحجوزات والطلبات</p>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 mb-5">
        <div class="row g-4">
            
            <!-- نموذج إضافة حجز جديد (في اليمين باللغة العربية) -->
            <div class="col-lg-4">
                <div class="card p-4">
                    <h4 class="mb-3 text-secondary border-bottom pb-3 text-end"><i class="fa-solid fa-calendar-plus ms-2 text-warning"></i>إضافة حجز جديد</h4>
                    <form id="bookingForm">
                        <div class="mb-3 text-end">
                            <label class="form-label fw-bold small">اسم العميل *</label>
                            <input type="text" class="form-control" name="customerName" required placeholder="مثال: أحمد عبدالله">
                        </div>
                        <div class="mb-3 text-end">
                            <label class="form-label fw-bold small">رقم الجوال *</label>
                            <input type="tel" class="form-control" name="mobileNumber" required placeholder="05XXXXXXXX">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3 text-end">
                                <label class="form-label fw-bold small">وقت التوصيل *</label>
                                <input type="time" class="form-control" name="deliveryTime" required>
                            </div>
                            <div class="col-md-6 mb-3 text-end">
                                <label class="form-label fw-bold small">تاريخ المناسبة *</label>
                                <input type="date" class="form-control" name="eventDate" required>
                            </div>
                        </div>
                        <div class="mb-3 text-end">
                            <label class="form-label fw-bold small">الصنف *</label>
                            <select class="form-select" name="dishType" required>
                                <option value="" selected disabled>اختر الصنف</option>
                                <option value="برياني">برياني</option>
                                <option value="مندي">مندي</option>
                                <option value="كبسة">كبسة</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3 text-end">
                                <label class="form-label fw-bold small">حجم الصواني *</label>
                                <select class="form-select" name="traySize" required>
                                    <option value="" selected disabled>اختر الحجم</option>
                                    <option value="45">45</option>
                                    <option value="50">50</option>
                                    <option value="55">55</option>
                                    <option value="60">60</option>
                                    <option value="سفري">سفري</option>
                                    <option value="مفطح">مفطح</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3 text-end">
                                <label class="form-label fw-bold small">عدد الصواني *</label>
                                <input type="number" class="form-control" name="traysCount" min="1" value="1" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3 text-end">
                                <label class="form-label fw-bold small">قطع الذبيحة *</label>
                                <input type="number" class="form-control" name="sheepPieces" min="0" value="0">
                            </div>
                            <div class="col-md-6 mb-3 text-end">
                                <label class="form-label fw-bold small">عدد الذبائح *</label>
                                <input type="number" class="form-control" name="sheepCount" min="0" value="0">
                            </div>
                        </div>
                        <div class="mb-3 text-end">
                            <label class="form-label fw-bold small">ملاحظات إضافية (اختياري)</label>
                            <textarea class="form-control" name="bookingNotes" rows="2" placeholder="تفضيلات الطعام، وقت التوصيل..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-bold shadow-sm" id="submitBtn">
                            <i class="fa-solid fa-check ms-2"></i>تأكيد وحفظ الحجز
                        </button>
                    </form>
                </div>
            </div>

            <!-- جدول الحجوزات (في اليسار بمساحة واسعة وترتيب صحيح) -->
            <div class="col-lg-8">
                <div class="card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-3">
                        <h4 class="text-secondary m-0"><i class="fa-solid fa-list-check ms-2 text-warning"></i>سجل الحجوزات</h4>
                        <span class="badge bg-light text-danger border px-3 py-2 fs-6" id="bookingCountBadge">0 حجز</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle text-end">
                            <thead class="table-light">
                                <tr>
                                    <th>العميل</th>
                                    <th>الموعد</th>
                                    <th>الصنف</th>
                                    <th>تفاصيل الكمية</th>
                                    <th>ملاحظات</th>
                                    <th>إجراء</th>
                                </tr>
                            </thead>
                            <tbody id="bookingsTableBody">
                                <tr id="loadingStateRow">
                                    <td colspan="6" class="text-center py-5 text-muted">
                                        <div class="spinner-border spinner-border-sm text-warning ms-2" role="status"></div>
                                        جاري تحميل الحجوزات من السحابة...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- نافذة النجاح -->
    <div class="modal fade" id="successModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-4">
                <div class="text-success fs-1 mb-2"><i class="fa-solid fa-circle-check"></i></div>
                <h5>تم حفظ الحجز بنجاح وإرساله للسحابة!</h5>
                <button type="button" class="btn btn-secondary mt-3" data-bs-dismiss="modal">حسناً</button>
            </div>
        </div>
    </div>

    <!-- نافذة الخطأ -->
    <div class="modal fade" id="errorModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-4">
                <div class="text-danger fs-1 mb-2"><i class="fa-solid fa-circle-exclamation"></i></div>
                <h5>حدث خطأ أثناء حفظ الحجز. الرجاء المحاولة مرة أخرى.</h5>
                <button type="button" class="btn btn-secondary mt-3" data-bs-dismiss="modal">حسناً</button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // ضع رابط تطبيق الويب الخاص بك هنا بين علامتي التنصيص
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyt-2TZFnFz6PVVWpkNzNAfSO2_UzQt_3SYCJgOsaPmJ4qdjquDjL3LBjPNORvFDajb8Q/exec';

        window.addEventListener('DOMContentLoaded', fetchBookings);

        async function fetchBookings() {
            const tbody = document.getElementById('bookingsTableBody');
            tbody.innerHTML = `<tr id="loadingStateRow"><td colspan="6" class="text-center py-5 text-muted"><div class="spinner-border spinner-border-sm text-warning ms-2"></div>جاري تحميل الحجوزات من السحابة...</td></tr>`;
            
            try {
                const response = await fetch(SCRIPT_URL);
                const result = await response.json();
                
                if (result.status === "success") {
                    renderTable(result.data);
                } else {
                    throw new Error('Failed to load data');
                }
            } catch (error) {
                console.error('Error:', error);
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-5 text-danger">حدث خطأ أثناء جلب الحجوزات. تحقق من رابط السكربت.</td></tr>`;
            }
        }

        let currentBookingsData = [];

        function renderTable(data) {
            currentBookingsData = data;
            const tbody = document.getElementById('bookingsTableBody');
            document.getElementById('bookingCountBadge').innerText = `${data.length} حجز`;
            
            if (data.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center py-5 text-muted">
                            <i class="fa-solid fa-folder-open fs-2 mb-2 text-secondary"></i>
                            <p class="mb-0 fw-bold">لا توجد حجوزات حالياً</p>
                            <small>قم بإضافة حجز جديد من النموذج الجانبي</small>
                        </td>
                    </tr>`;
                return;
            }

            tbody.innerHTML = '';
            data.forEach((row, index) => {
                let formattedDate = row.eventDate || '';
                if (formattedDate.includes('T')) {
                    formattedDate = formattedDate.split('T')[0];
                }

                let formattedTime = row.deliveryTime || '';
                if (formattedTime.includes('T')) {
                    const timePart = formattedTime.split('T')[1];
                    formattedTime = timePart ? timePart.substring(0, 5) : '';
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <div class="fw-bold text-dark">${row.customerName || ''}</div>
                        <small class="text-muted">${row.mobileNumber || ''}</small>
                    </td>
                    <td>
                        <div>${formattedDate}</div>
                        <small class="text-muted"><i class="fa-regular fa-clock ms-1"></i>${formattedTime}</small>
                    </td>
                    <td><span class="badge bg-light text-dark border">${row.dishType || ''}</span></td>
                    <td>
                        صواني: ${row.traysCount || 0} (${row.traySize || ''})<br>
                        <small class="text-muted">ذبائح: ${row.sheepCount || 0} | قطع: ${row.sheepPieces || 0}</small>
                    </td>
                    <td>${row.bookingNotes || '-'}</td>
                    <td>
                        <button class="btn btn-outline-danger btn-sm" title="حذف" onclick="alert('للحذف، يرجى إزالته مباشرة من ملف Google Sheets السحابي.')">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('bookingForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<div class="spinner-border spinner-border-sm ms-2"></div>جاري الحفظ...';
            submitBtn.disabled = true;

            const formData = new FormData(this);
            
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });

                if(response.ok) {
                    const modal = new bootstrap.Modal(document.getElementById('successModal'));
                    modal.show();
                    this.reset();
                    fetchBookings(); 
                } else {
                    throw new Error('Network response was not ok');
                }
            } catch (error) {
                console.error('Error:', error);
                const modal = new bootstrap.Modal(document.getElementById('errorModal'));
                modal.show();
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });

        function exportToExcel() {
            if (currentBookingsData.length === 0) {
                alert('لا توجد بيانات لتصديرها!');
                return;
            }
            
            let csvContent = "\uFEFFاسم العميل,رقم الجوال,تاريخ المناسبة,وقت التوصيل,الصنف,عدد الصواني,حجم الصواني,عدد الذبائح,قطع الذبيحة,ملاحظات\n";
            
            currentBookingsData.forEach(row => {
                let rowData = [
                    `"${row.customerName || ''}"`,
                    `"${row.mobileNumber || ''}"`,
                    `"${row.eventDate || ''}"`,
                    `"${row.deliveryTime || ''}"`,
                    `"${row.dishType || ''}"`,
                    `"${row.traysCount || ''}"`,
                    `"${row.traySize || ''}"`,
                    `"${row.sheepCount || ''}"`,
                    `"${row.sheepPieces || ''}"`,
                    `"${row.bookingNotes || ''}"`
                ];
                csvContent += rowData.join(",") + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'مطبخ_الصحاف_الحجوزات.csv');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
