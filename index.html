<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطبخ الصحاف للمناسبات - إدارة الحجوزات</title>
    <!-- Bootstrap RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; }
        .navbar { background: linear-gradient(135deg, #2c3e50, #4ca1af); }
        .card { border: none; box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05); border-radius: 12px; }
        .btn-primary { background-color: #4ca1af; border-color: #4ca1af; }
        .btn-primary:hover { background-color: #3b8b98; border-color: #3b8b98; }
        .table-hover tbody tr:hover { background-color: rgba(76, 161, 175, 0.05); }
        .form-control, .form-select { border-radius: 8px; padding: 10px 15px; }
        .badge { font-size: 0.9rem; }
    </style>
</head>
<body>

    <!-- النافبار -->
    <nav class="navbar navbar-dark shadow-sm mb-4">
        <div class="container-fluid px-4">
            <span class="navbar-brand mb-0 h1 fs-4"><i class="fa-solid fa-utensils ms-2"></i> مطبخ الصحاف للمناسبات</span>
            <span class="badge bg-light text-dark fs-6 px-3 py-2 shadow-sm" id="bookingCountBadge">0 حجز</span>
        </div>
    </nav>

    <div class="container-fluid px-4 mb-5">
        <div class="row g-4">
            <!-- نموذج إضافة حجز -->
            <div class="col-lg-4">
                <div class="card p-4">
                    <h4 class="mb-3 text-secondary border-bottom pb-2"><i class="fa-solid fa-plus-circle ms-2"></i>إضافة حجز جديد</h4>
                    <form id="bookingForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">اسم العميل</label>
                            <input type="text" class="form-control" name="customerName" required placeholder="أدخل اسم العميل الكريم">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">رقم الجوال</label>
                            <input type="tel" class="form-control" name="mobileNumber" required placeholder="05xxxxxxxx">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">تاريخ المناسبة</label>
                            <input type="date" class="form-control" name="eventDate" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">وقت التوصيل</label>
                            <input type="time" class="form-control" name="deliveryTime" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">الصنف</label>
                            <select class="form-select" name="dishType" required>
                                <option value="" selected disabled>اختر الصنف...</option>
                                <option value="برياني">برياني</option>
                                <option value="مندي">مندي</option>
                                <option value="كبسة">كبسة</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">عدد الصواني</label>
                            <input type="number" class="form-control" name="traysCount" min="1" value="1" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">حجم الصواني</label>
                            <select class="form-select" name="traySize" required>
                                <option value="45">45</option>
                                <option value="50">50</option>
                                <option value="55">55</option>
                                <option value="60">60</option>
                                <option value="سفري">سفري</option>
                                <option value="مفطح">مفطح</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">عدد الذبائح</label>
                            <input type="number" class="form-control" name="sheepCount" min="0" value="0">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">عدد قطة الذبيحة</label>
                            <input type="number" class="form-control" name="sheepPieces" min="0" value="0">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">ملاحظات (اختياري)</label>
                            <textarea class="form-control" name="bookingNotes" rows="2" placeholder="أي تفاصيل إضافية..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm" id="submitBtn">
                            <i class="fa-solid fa-save ms-2"></i>حفظ الحجز
                        </button>
                    </form>
                </div>
            </div>

            <!-- جدول الحجوزات -->
            <div class="col-lg-8">
                <div class="card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
                        <h4 class="text-secondary m-0"><i class="fa-solid fa-list ms-2"></i>جدول الحجوزات الحالية</h4>
                        <button class="btn btn-outline-success btn-sm" onclick="fetchBookings()">
                            <i class="fa-solid fa-sync ms-1"></i>تحديث البيانات
                        </button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>العميل</th>
                                    <th>الجوال</th>
                                    <th>التاريخ والوقت</th>
                                    <th>الصنف</th>
                                    <th>تفاصيل الكمية</th>
                                    <th>ملاحظات</th>
                                </tr>
                            </thead>
                            <tbody id="bookingsTableBody">
                                <tr id="loadingStateRow">
                                    <td colspan="6" class="text-center py-4 text-muted">
                                        <div class="spinner-border spinner-border-sm text-primary ms-2" role="status"></div>
                                        جاري تحميل الحجوزات من السحابة...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة النجاح -->
    <div class="modal fade" id="successModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-4">
                <div class="text-success fs-1 mb-2"><i class="fa-solid fa-circle-check"></i></div>
                <h5>تم حفظ الحجز بنجاح وإرساله للسحابة!</h5>
                <button type="button" class="btn btn-secondary mt-3" data-bs-dismiss="modal">حسناً</button>
            </div>
        </div>
    </div>

    <!-- نافذة الخطأ -->
    <div class="modal fade" id="errorModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-4">
                <div class="text-danger fs-1 mb-2"><i class="fa-solid fa-circle-exclamation"></i></div>
                <h5>حدث خطأ أثناء حفظ الحجز. الرجاء المحاولة مرة أخرى.</h5>
                <button type="button" class="btn btn-secondary mt-3" data-bs-dismiss="modal">حسناً</button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // ضع رابط تطبيق الويب الخاص بك هنا بين علامتي التنصيص
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyt-2TZFnFz6PVVWpkNzNAfSO2_UzQt_3SYCJgOsaPmJ4qdjquDjL3LBjPNORvFDajb8Q/exec';

        window.addEventListener('DOMContentLoaded', fetchBookings);

        async function fetchBookings() {
            const tbody = document.getElementById('bookingsTableBody');
            tbody.innerHTML = `<tr id="loadingStateRow"><td colspan="6" class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm text-primary ms-2"></div>جاري تحميل الحجوزات من السحابة...</td></tr>`;
            
            try {
                const response = await fetch(SCRIPT_URL);
                const result = await response.json();
                
                if (result.status === "success") {
                    renderTable(result.data);
                } else {
                    throw new Error('Failed to load data');
                }
            } catch (error) {
                console.error('Error:', error);
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-danger">حدث خطأ أثناء جلب الحجوزات. تحقق من رابط السكربت.</td></tr>`;
            }
        }

    function renderTable(data) {
            const tbody = document.getElementById('bookingsTableBody');
            document.getElementById('bookingCountBadge').innerText = `${data.length} حجز`;
            
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">لا توجد حجوزات مسجلة حتى الآن</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            data.forEach(row => {
                // تنسيق التاريخ ليصبح سهل القراءة
                let formattedDate = row.eventDate || '';
                if (formattedDate.includes('T')) {
                    formattedDate = formattedDate.split('T')[0];
                }

                // تنسيق الوقت ليصبح واضحاً
                let formattedTime = row.deliveryTime || '';
                if (formattedTime.includes('T')) {
                    const timePart = formattedTime.split('T')[1];
                    formattedTime = timePart ? timePart.substring(0, 5) : '';
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="fw-bold">${row.customerName || ''}</td>
                    <td>${row.mobileNumber || ''}</td>
                    <td><i class="fa-regular fa-calendar-days text-muted ms-1"></i> ${formattedDate} <br><small class="text-muted"><i class="fa-regular fa-clock ms-1"></i> ${formattedTime}</small></td>
                    <td><span class="badge bg-secondary">${row.dishType || ''}</span></td>
                    <td>
                        صواني: ${row.traysCount || 0} (${row.traySize || ''})<br>
                        <small class="text-muted">ذبائح: ${row.sheepCount || 0} | قطة: ${row.sheepPieces || 0}</small>
                    </td>
                    <td>${row.bookingNotes || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('bookingForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<div class="spinner-border spinner-border-sm ms-2"></div>جاري الحفظ...';
            submitBtn.disabled = true;

            const formData = new FormData(this);
            
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });

                if(response.ok) {
                    const modal = new bootstrap.Modal(document.getElementById('successModal'));
                    modal.show();
                    this.reset();
                    fetchBookings(); 
                } else {
                    throw new Error('Network response was not ok');
                }
            } catch (error) {
                console.error('Error:', error);
                const modal = new bootstrap.Modal(document.getElementById('errorModal'));
                modal.show();
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
